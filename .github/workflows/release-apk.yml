name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (con modelos Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build installable APK (Debug)
        run: ./gradlew assembleDebug

      - name: Rename APK with tag or run number
        run: |
          VERSION_TAG="${GITHUB_REF_NAME:-build-${GITHUB_RUN_NUMBER}}"
          cp app/build/outputs/apk/debug/app-debug.apk "PixelUpIA-${VERSION_TAG}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelUpIA-APK
          path: PixelUpIA-*.apk

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PixelUpIA-*.apk
          generate_release_notes: true