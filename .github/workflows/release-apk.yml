name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version opcional (ej. 1.2.0). Vacio = automatico'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (con modelos Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute automatic version
        id: version
        shell: bash
        run: |
          RAW_INPUT="${{ inputs.version_name }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_RAW="${GITHUB_REF_NAME}"
          elif [ -n "$RAW_INPUT" ]; then
            TAG_RAW="v${RAW_INPUT#v}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.1.0")
            TAG_RAW="${LATEST_TAG}"
          fi

          CLEAN_NAME="${TAG_RAW#v}"
          if [[ "$CLEAN_NAME" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))? ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[4]:-0}"
          else
            MAJOR=1
            MINOR=1
            PATCH=0
          fi

          BASE_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] || [ -n "$RAW_INPUT" ]; then
            VERSION_NAME="$CLEAN_NAME"
            VERSION_CODE="$BASE_CODE"
            ARTIFACT_LABEL="v${CLEAN_NAME}"
          else
            VERSION_NAME="${CLEAN_NAME}-build.${GITHUB_RUN_NUMBER}"
            VERSION_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
            ARTIFACT_LABEL="v${VERSION_NAME}"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "artifact_label=${ARTIFACT_LABEL}" >> "$GITHUB_OUTPUT"
          echo "Resolved Version: ${VERSION_NAME} (versionCode=${VERSION_CODE})"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64 en Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.jks

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionCode="${{ steps.version.outputs.version_code }}" \
            -PappVersionName="${{ steps.version.outputs.version_name }}"

      - name: Rename signed APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::No se genero app-release.apk firmado. Verifica los secretos KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD."
            exit 1
          fi
          cp "$APK_PATH" "PixelUpIA-${{ steps.version.outputs.artifact_label }}.apk"

      - name: Clean up temporary Keystore
        if: always()
        run: rm -f release.jks

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelUpIA-APK
          path: PixelUpIA-*.apk

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PixelUpIA-*.apk
          generate_release_notes: true
